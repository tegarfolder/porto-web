<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<title>Project :: Putra Tegar</title>
<link rel="stylesheet" href="../../assets/site.css">
<script src="../../assets/theme.js"></script>
</head>
<body>
<div class="shell">

  <header>
    <a class="mark" href="../../"><span class="mark-thin">Putra</span> Tegar</a>
    <nav>
      <a href="../" aria-current="page">Works</a>
      <a href="../../services/">Services</a>
      <a href="../../about/">About</a>
    </nav>
    <button class="mode" id="mode" type="button" aria-label="Switch to dark mode"></button>
  </header>

  <main id="proj">
    <section class="phead">
      <div class="crumb lab"><a href="../../">Home</a> &rsaquo; <a href="../">Works</a></div>
      <h1 class="ptitle">Loading</h1>
    </section>
  </main>

  <footer>
    <span class="lab">Putra Tegar &mdash; 2026</span>
    <span class="lab">Instagram &middot; Behance &middot; YouTube</span>
  </footer>

</div>
<script src="../../assets/site.js" data-root="../../"></script>
<script>
(async function () {
  const el = document.getElementById('proj');
  const slug = new URLSearchParams(location.search).get('p');
  try {
    const d = await data();
    const p = d.projects.find(x => x.slug === slug);
    if (!p) {
      el.innerHTML = `<section class="phead">
        <div class="crumb lab"><a href="../../">Home</a> &rsaquo; <a href="../">Works</a></div>
        <h1 class="ptitle">Not found</h1>
        <p class="pblurb">No project matches "${slug ? slug.replace(/[<>&"]/g,'') : 'that address'}".
        Browse everything on the <a class="mailto" href="../">works page</a>.</p></section>`;
      return;
    }
    document.title = p.title + ' — Putra Tegar';
    document.body.className = 'c-' + p.category;

    const i = d.projects.indexOf(p);
    const next = d.projects[(i + 1) % d.projects.length];
    const cat = p.category[0].toUpperCase() + p.category.slice(1);

    /* Playback params are built here rather than stored raw in projects.json —
       admin only stores the plain autoplay/muted/loop/controls booleans per
       block, and this turns them into each provider's actual query string.
       Autoplay always forces muted: browsers refuse unmuted autoplay
       outright, so a block asking for both silently gets sound stripped
       rather than failing to play at all. */
    const ytSrc = b => {
      const id = (String(b.url).match(/embed\/([\w-]+)/) || [])[1];
      if (!id) return null;
      const q = new URLSearchParams({ rel: '0', iv_load_policy: '3', playsinline: '1' });
      q.set('controls', b.controls === false ? '0' : '1');
      if (b.loop) { q.set('loop', '1'); q.set('playlist', id); }
      if (b.autoplay) { q.set('autoplay', '1'); q.set('mute', '1'); }
      else if (b.muted) q.set('mute', '1');
      return b.url.split('?')[0] + '?' + q;
    };
    const vimeoSrc = b => {
      const id = (String(b.url).match(/vimeo\.com\/(?:video\/)?(\d+)/) || [])[1];
      if (!id) return null;
      const q = new URLSearchParams({ title: '0', byline: '0', portrait: '0' });
      q.set('controls', b.controls === false ? '0' : '1');
      if (b.loop) q.set('loop', '1');
      if (b.autoplay) { q.set('autoplay', '1'); q.set('muted', '1'); }
      else if (b.muted) q.set('muted', '1');
      return 'https://player.vimeo.com/video/' + id + '?' + q;
    };
    /* Mux's public embed player (player.mux.com) accepts the same shape of
       param as its own <mux-player> element. block.url is either a bare
       Playback ID or a full player.mux.com link. */
    const muxSrc = b => {
      const raw = String(b.url).trim();
      const id = /^[\w-]+$/.test(raw) ? raw : (raw.match(/player\.mux\.com\/([\w-]+)/) || [])[1];
      if (!id) return null;
      const q = new URLSearchParams();
      if (b.autoplay) q.set('autoplay', 'muted');
      else if (b.muted) q.set('muted', 'true');
      if (b.loop) q.set('loop', 'true');
      return 'https://player.mux.com/' + id + (q.toString() ? '?' + q : '');
    };
    const IFRAME_ALLOW = 'autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture';

    function renderBlock(b) {
      let inner = '';
      if (b.type === 'image') {
        inner = `<img src="${esc(assetUrl(b.url))}" alt="${esc(b.caption || p.title)}" loading="lazy">`;
      } else if (b.provider === 'youtube') {
        const src = ytSrc(b);
        if (src) inner = `<iframe src="${esc(src)}" title="${esc(p.title)}" allow="${IFRAME_ALLOW}"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>`;
      } else if (b.provider === 'vimeo') {
        const src = vimeoSrc(b);
        if (src) inner = `<iframe src="${esc(src)}" title="${esc(p.title)}" allow="${IFRAME_ALLOW}"
          allowfullscreen loading="lazy"></iframe>`;
      } else if (b.provider === 'mux') {
        const src = muxSrc(b);
        if (src) inner = `<iframe src="${esc(src)}" title="${esc(p.title)}" allow="${IFRAME_ALLOW}"
          allowfullscreen loading="lazy"></iframe>`;
      } else if (b.provider === 'frameio' || b.provider === 'custom') {
        /* Escape hatch: whatever URL was pasted, embedded as-is, no param
           rewriting — for providers with no stable public query-param API. */
        if (b.url) inner = `<iframe src="${esc(b.url)}" title="${esc(p.title)}" allow="${IFRAME_ALLOW}"
          allowfullscreen loading="lazy"></iframe>`;
      } else if (b.provider === 'r2') {
        const attrs = ['playsinline'];
        if (b.autoplay) attrs.push('autoplay');
        if (b.autoplay || b.muted) attrs.push('muted');
        if (b.loop) attrs.push('loop');
        if (b.controls) attrs.push('controls');
        inner = `<video src="${esc(assetUrl(b.url))}" ${attrs.join(' ')} preload="metadata"${
          b.poster ? ` poster="${esc(assetUrl(b.poster))}"` : ''}></video>`;
      }
      if (!inner) return '';
      const cap = b.caption ? `<p class="block-cap">${esc(b.caption)}</p>` : '';
      return `<div class="block-item"><div class="block">${inner}</div>${cap}</div>`;
    }

    /* Accepts either typing style: comma-separated ("json, interactive") or
       space-separated with the # already typed ("#json #interactive"), or
       any mix — split on commas and/or whitespace, then strip any leading #
       so it's never doubled when this line adds its own. */
    const tags = (p.tags || '').split(/[,\s]+/).map(s => s.replace(/^#+/, '').trim()).filter(Boolean);
    const tagsHTML = tags.map(t => `<span class="tagchip">#${esc(t)}</span>`).join(' ');
    const toolsList = (p.tools || '').split(',').map(s => s.trim()).filter(Boolean);
    const toolsHTML = toolsList.map(t => `<span class="pill">${esc(t)}</span>`).join(' ');

    /* Meta section: Description and Tools each get their own full-width row;
       Category and Hashtags share one row, side by side, since Category is
       always present but often short enough to sit next to the tag list
       rather than claim a whole row of its own. Any row/column with nothing
       in it is simply omitted, never shown as a label over nothing. */
    const metaParts = [];
    if (p.summary) metaParts.push(
      `<div class="pmeta-row"><span class="lab">Description</span><p>${p.summary}</p></div>`);
    metaParts.push(
      `<div class="pmeta-row pmeta-pair">
        <div class="pmeta-col"><span class="lab">Category</span><span class="pill">${cat}</span></div>
        ${tagsHTML ? `<div class="pmeta-col"><span class="lab">Hashtags</span>${tagsHTML}</div>` : ''}
      </div>`);
    if (toolsHTML) metaParts.push(
      `<div class="pmeta-row"><span class="lab">Tools</span>${toolsHTML}</div>`);
    const metaHTML = metaParts.join('');

    const blocksHTML = (p.blocks && p.blocks.length)
      ? p.blocks.map(renderBlock).join('')
      : `<div class="block-item"><div class="block" style="aspect-ratio:16/9;position:relative;color:var(--acc)">
          <svg viewBox="0 0 160 90" preserveAspectRatio="none"
            style="position:absolute;inset:0;width:100%;height:100%;opacity:var(--art-op)"
            aria-hidden="true">${art(p.category, 1, 160, 90)}</svg>
          <span class="lab" style="position:absolute;left:16px;bottom:14px">Video not uploaded yet</span>
        </div></div>`;

    el.innerHTML = `
      <section class="phead">
        <div class="crumb lab"><a href="../../">Home</a> &rsaquo; <a href="../">Works</a>
          &rsaquo; <a href="../${p.category}/">${cat}</a></div>
        <h1 class="ptitle">${p.title}</h1>
      </section>
      <div class="pmeta">${metaHTML}</div>
      <div class="blocks">${blocksHTML}</div>
      <div class="nextrow">
        <span class="lab">Next</span>
        <a href="./?p=${next.slug}">${next.title}</a>
      </div>`;
  } catch (e) {
    el.innerHTML = `<section class="phead"><h1 class="ptitle">Unavailable</h1>
      <p class="pblurb">${e.message}</p></section>`;
  }
})();
</script>
</body>
</html>
