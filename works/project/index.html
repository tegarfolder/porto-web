<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<title>Project :: Putra Tegar</title>
<link rel="stylesheet" href="../../assets/site.css">
<script src="../../assets/theme.js"></script>
<script src="../../assets/transitions.js"></script>
<!-- TOOLS / findTool() / toolBadgeSVG() come from here, shared with the
     admin editor so the tool index is defined in exactly one place. -->
<script src="../../assets/tools.js"></script>
</head>
<body>
<div class="shell">

  <header>
    <a class="mark" href="../../"><span class="mark-thin">Putra</span> Tegar</a>
    <nav>
      <a href="../" aria-current="page">Works</a>
      <a href="../../services/">Services</a>
      <a href="../../about/">About</a>
    </nav>
    <button class="mode" id="mode" type="button" aria-label="Switch to dark mode"></button>
  </header>

  <main id="proj">
    <section class="phead">
      <div class="crumb lab"><a href="../../">Home</a> &rsaquo; <a href="../">Works</a></div>
      <h1 class="ptitle">Loading</h1>
    </section>
  </main>

  <footer>
    <span class="lab">Putra Tegar &mdash; 2026</span>
    <span class="lab">Instagram &middot; Behance &middot; YouTube</span>
  </footer>

</div>
<!-- Outside .shell on purpose — a modal overlay belongs at the document
     root, not inside a max-width wrapper it needs to cover regardless of. -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" type="button" aria-label="Close preview">&times;</button>
  <div class="lightbox-content" id="lightboxContent"></div>
</div>
<script src="../../assets/site.js" data-root="../../"></script>
<script>
/* ---------- content-block lightbox ----------
   Moves the clicked block's actual media node into the overlay rather than
   cloning it — reparenting a <video>/<iframe> preserves its playback state
   (an autoplaying loop just keeps looping, seamlessly bigger), where
   cloning would create a second, independent element starting from zero. */
(function setupLightbox() {
  const box = document.getElementById('lightbox');
  const content = document.getElementById('lightboxContent');
  let homeParent = null, homeNext = null, active = null;

  function close() {
    if (!active) return;
    homeParent.insertBefore(active, homeNext);
    box.classList.remove('open');
    document.body.style.overflow = '';
    active = null;
  }
  function open(media) {
    if (active) close();
    homeParent = media.parentElement;
    homeNext = media.nextSibling;
    active = media;
    content.appendChild(media);
    box.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  box.addEventListener('click', e => { if (e.target === box) close(); });
  box.querySelector('.lightbox-close').addEventListener('click', close);
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  /* Delegated, so it keeps working after el.innerHTML replaces the blocks —
     no need to re-wire listeners on every render. */
  document.addEventListener('click', e => {
    const btn = e.target.closest('.block-expand');
    if (!btn) return;
    const media = btn.previousElementSibling;
    if (media) open(media);
  });
})();

(async function () {
  const el = document.getElementById('proj');
  const slug = new URLSearchParams(location.search).get('p');
  try {
    const d = await data();
    const p = d.projects.find(x => x.slug === slug);
    if (!p) {
      el.innerHTML = `<section class="phead">
        <div class="crumb lab"><a href="../../">Home</a> &rsaquo; <a href="../">Works</a></div>
        <h1 class="ptitle">Not found</h1>
        <p class="pblurb">No project matches "${slug ? slug.replace(/[<>&"]/g,'') : 'that address'}".
        Browse everything on the <a class="mailto" href="../">works page</a>.</p></section>`;
      return;
    }
    document.title = p.title + ' — Putra Tegar';
    document.body.className = 'c-' + p.category;

    const i = d.projects.indexOf(p);
    const next = d.projects[(i + 1) % d.projects.length];
    const cat = p.category[0].toUpperCase() + p.category.slice(1);

    /* Playback params are built here rather than stored raw in projects.json —
       admin only stores the plain autoplay/muted/loop/controls booleans per
       block, and this turns them into each provider's actual query string.
       Autoplay always forces muted: browsers refuse unmuted autoplay
       outright, so a block asking for both silently gets sound stripped
       rather than failing to play at all. */
    const ytSrc = b => {
      const id = (String(b.url).match(/embed\/([\w-]+)/) || [])[1];
      if (!id) return null;
      const q = new URLSearchParams({ rel: '0', iv_load_policy: '3', playsinline: '1' });
      q.set('controls', b.controls === false ? '0' : '1');
      if (b.loop) { q.set('loop', '1'); q.set('playlist', id); }
      if (b.autoplay) { q.set('autoplay', '1'); q.set('mute', '1'); }
      else if (b.muted) q.set('mute', '1');
      return b.url.split('?')[0] + '?' + q;
    };
    const vimeoSrc = b => {
      const id = (String(b.url).match(/vimeo\.com\/(?:video\/)?(\d+)/) || [])[1];
      if (!id) return null;
      const q = new URLSearchParams({ title: '0', byline: '0', portrait: '0' });
      q.set('controls', b.controls === false ? '0' : '1');
      if (b.loop) q.set('loop', '1');
      if (b.autoplay) { q.set('autoplay', '1'); q.set('muted', '1'); }
      else if (b.muted) q.set('muted', '1');
      return 'https://player.vimeo.com/video/' + id + '?' + q;
    };
    /* Mux's public embed player (player.mux.com) accepts the same shape of
       param as its own <mux-player> element. block.url is either a bare
       Playback ID or a full player.mux.com link. */
    const muxSrc = b => {
      const raw = String(b.url).trim();
      const id = /^[\w-]+$/.test(raw) ? raw : (raw.match(/player\.mux\.com\/([\w-]+)/) || [])[1];
      if (!id) return null;
      const q = new URLSearchParams();
      if (b.autoplay) q.set('autoplay', 'muted');
      else if (b.muted) q.set('muted', 'true');
      if (b.loop) q.set('loop', 'true');
      return 'https://player.mux.com/' + id + (q.toString() ? '?' + q : '');
    };
    const IFRAME_ALLOW = 'autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    const EXPAND_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';

    function renderBlock(b) {
      let inner = '';
      if (b.type === 'image') {
        inner = `<img src="${esc(assetUrl(b.url))}" alt="${esc(b.caption || p.title)}" loading="lazy">`;
      } else if (b.provider === 'youtube') {
        const src = ytSrc(b);
        if (src) inner = `<iframe src="${esc(src)}" title="${esc(p.title)}" allow="${IFRAME_ALLOW}"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>`;
      } else if (b.provider === 'vimeo') {
        const src = vimeoSrc(b);
        if (src) inner = `<iframe src="${esc(src)}" title="${esc(p.title)}" allow="${IFRAME_ALLOW}"
          allowfullscreen loading="lazy"></iframe>`;
      } else if (b.provider === 'mux') {
        const src = muxSrc(b);
        if (src) inner = `<iframe src="${esc(src)}" title="${esc(p.title)}" allow="${IFRAME_ALLOW}"
          allowfullscreen loading="lazy"></iframe>`;
      } else if (b.provider === 'frameio' || b.provider === 'custom') {
        /* Escape hatch: whatever URL was pasted, embedded as-is, no param
           rewriting — for providers with no stable public query-param API. */
        if (b.url) inner = `<iframe src="${esc(b.url)}" title="${esc(p.title)}" allow="${IFRAME_ALLOW}"
          allowfullscreen loading="lazy"></iframe>`;
      } else if (b.provider === 'r2') {
        const attrs = ['playsinline'];
        if (b.autoplay) attrs.push('autoplay');
        if (b.autoplay || b.muted) attrs.push('muted');
        if (b.loop) attrs.push('loop');
        if (b.controls) attrs.push('controls');
        inner = `<video src="${esc(assetUrl(b.url))}" ${attrs.join(' ')} preload="metadata"${
          b.poster ? ` poster="${esc(assetUrl(b.poster))}"` : ''}></video>`;
      }
      if (!inner) return '';
      const cap = b.caption ? `<p class="block-cap">${esc(b.caption)}</p>` : '';
      /* The expand button is a separate hit target from the media itself —
         making the whole block clickable would fight a video's own native
         play/pause controls, and clicks inside a cross-origin iframe (a
         YouTube/Vimeo/etc. embed) can't be detected from this page at all,
         so a plain "click the block" handler wouldn't even work for those. */
      return `<div class="block-item"><div class="block">${inner}
        <button class="block-expand" type="button" aria-label="View larger">${EXPAND_ICON}</button>
      </div>${cap}</div>`;
    }

    /* p.tags isn't shown on this page — still in the data, still what
       drives the hover title on grid cards and bento tiles (parseTags() /
       tagsHTML() in assets/site.js). */
    const toolsList = (p.tools || '').split(',').map(s => s.trim()).filter(Boolean);
    /* An overlapping icon stack + count ("N tools"), not a pill per tool —
       hovering (or keyboard-focusing) it reveals the full list, each with
       its badge from assets/tools.js (findTool()/toolBadgeSVG(), shared
       with the admin editor's picker). Only the first few badges stack
       visually (TOOL_STACK_MAX); beyond that a "+N" caps the stack instead
       of it growing without bound. A name typed by hand that isn't in that
       index still counts and still shows in the hover list, it just has no
       badge to contribute to the stack. */
    const TOOL_STACK_MAX = 4;
    const toolsHTML = toolsList.length ? (() => {
      const shown = toolsList.slice(0, TOOL_STACK_MAX);
      const overflow = toolsList.length - shown.length;
      const stackHTML = shown.map((name, i) => {
        const tool = findTool(name);
        return `<span class="tool-stack-item" style="z-index:${shown.length - i}">${
          tool ? toolBadgeSVG(tool) : '<span class="tool-stack-blank"></span>'}</span>`;
      }).join('');
      const moreHTML = overflow > 0 ? `<span class="tool-stack-more">+${overflow}</span>` : '';
      return `
      <div class="tools-pop">
        <button type="button" class="pill tools-trigger">
          <span class="tool-stack">${stackHTML}${moreHTML}</span>
          <span>${toolsList.length} tool${toolsList.length === 1 ? '' : 's'}</span>
        </button>
        <div class="tools-list" role="tooltip">
          ${toolsList.map(name => {
            const tool = findTool(name);
            return `<div class="tools-list-row">${tool ? toolBadgeSVG(tool) : ''}<span>${esc(name)}</span></div>`;
          }).join('')}
        </div>
      </div>`;
    })() : '';

    /* Category and Tools now share one row — Category on the left, Tools on
       the right (.pmeta-split) — instead of each claiming a full row of its
       own. Description keeps its "Description" label; neither of these
       does, just the pill/trigger. Tools is omitted entirely when there are
       none, leaving Category to fill the row alone. Tags no longer show on
       this page at all — still in the data, still used by the card/bento
       hover (see the comment above toolsList for where p.tags is used). */
    const metaParts = [];
    if (p.summary) metaParts.push(
      `<div class="pmeta-row"><span class="lab">Description</span><p>${p.summary}</p></div>`);
    metaParts.push(
      `<div class="pmeta-row pmeta-split"><span class="pill">${cat}</span>${toolsHTML}</div>`);
    const metaHTML = metaParts.join('');

    const blocksHTML = (p.blocks && p.blocks.length)
      ? p.blocks.map(renderBlock).join('')
      : `<div class="block-item"><div class="block" style="aspect-ratio:16/9;position:relative;color:var(--acc)">
          <svg viewBox="0 0 160 90" preserveAspectRatio="none"
            style="position:absolute;inset:0;width:100%;height:100%;opacity:var(--art-op)"
            aria-hidden="true">${art(p.category, 1, 160, 90)}</svg>
          <span class="lab" style="position:absolute;left:16px;bottom:14px">Video not uploaded yet</span>
        </div></div>`;

    el.innerHTML = `
      <section class="phead">
        <div class="crumb lab"><a href="../../">Home</a> &rsaquo; <a href="../">Works</a>
          &rsaquo; <a href="../${p.category}/">${cat}</a></div>
        <h1 class="ptitle">${p.title}</h1>
      </section>
      <div class="pmeta">${metaHTML}</div>
      <div class="blocks">${blocksHTML}</div>
      <div class="nextrow">
        <span class="lab">Next</span>
        <a href="./?p=${next.slug}">${next.title}</a>
      </div>`;
  } catch (e) {
    el.innerHTML = `<section class="phead"><h1 class="ptitle">Unavailable</h1>
      <p class="pblurb">${e.message}</p></section>`;
  }
})();
</script>
</body>
</html>
