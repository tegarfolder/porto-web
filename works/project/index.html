<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<title>Project :: Putra Tegar</title>
<link rel="stylesheet" href="../../assets/site.css">
<script src="../../assets/theme.js"></script>
</head>
<body>
<div class="shell">

  <header>
    <a class="mark" href="../../"><span class="mark-thin">Putra</span> Tegar</a>
    <nav>
      <a href="../" aria-current="page">Works</a>
      <a href="../../services/">Services</a>
      <a href="../../about/">About</a>
    </nav>
    <button class="mode" id="mode" type="button" aria-label="Switch to dark mode"></button>
  </header>

  <main id="proj">
    <section class="phead">
      <div class="crumb lab"><a href="../../">Home</a> &rsaquo; <a href="../">Works</a></div>
      <h1 class="ptitle">Loading</h1>
    </section>
  </main>

  <footer>
    <span class="lab">Putra Tegar &mdash; 2026</span>
    <span class="lab">Instagram &middot; Behance &middot; YouTube</span>
  </footer>

</div>
<script src="../../assets/site.js" data-root="../../"></script>
<script>
(async function () {
  const el = document.getElementById('proj');
  const slug = new URLSearchParams(location.search).get('p');
  try {
    const d = await data();
    const p = d.projects.find(x => x.slug === slug);
    if (!p) {
      el.innerHTML = `<section class="phead">
        <div class="crumb lab"><a href="../../">Home</a> &rsaquo; <a href="../">Works</a></div>
        <h1 class="ptitle">Not found</h1>
        <p class="pblurb">No project matches "${slug ? slug.replace(/[<>&"]/g,'') : 'that address'}".
        Browse everything on the <a class="mailto" href="../">works page</a>.</p></section>`;
      return;
    }
    document.title = p.title + ' — Putra Tegar';
    document.body.className = 'c-' + p.category;

    const i = d.projects.indexOf(p);
    const next = d.projects[(i + 1) % d.projects.length];
    const cat = p.category[0].toUpperCase() + p.category.slice(1);

    /* Playback params are applied here rather than stored in projects.json, so
       the saved URL stays clean and this behaviour can change without
       re-saving every project.

       No autoplay, deliberately: browsers block sound-on autoplay outright, so
       autoplay and audio are mutually exclusive. The piece is meant to be heard
       from frame one, so the visitor presses play and gets sound immediately —
       rather than autostarting silent and missing half the sound design.

       controls=1 also gives YouTube's native hide-on-idle behaviour: the bar
       fades out during playback while the pointer is away and returns on mouse
       move. That cannot be built ourselves — the iframe is cross-origin, so its
       UI is unreachable from this page.

       rel=0 does NOT remove recommendations; since 2018 it only limits them to
       this same channel. loop does more for that goal, by never letting the
       video reach the end screen where they appear most prominently. Looping
       requires playlist=<id> alongside it.

       showinfo and modestbranding are deprecated and no longer do anything.
    */
    const ytPlayback = url => {
      const id = (url.match(/embed\/([\w-]+)/) || [])[1];
      if (!id || !/youtube(-nocookie)?\.com\/embed\//.test(url)) return url;
      const q = new URLSearchParams({
        controls: '1', rel: '0',
        playsinline: '1', iv_load_policy: '3', loop: '1', playlist: id
      });
      return url.split('?')[0] + '?' + q;
    };

    let player;
    /* `autoplay` stays in allow= so re-enabling it is a one-line change to
       ytPlayback above; without it the iframe would be refused permission. */
    if (p.embed)      player = `<iframe src="${esc(ytPlayback(p.embed))}" title="${esc(p.title)}"
      allow="autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen loading="lazy"></iframe>`;
    else if (p.video) player = `<video src="${assetUrl(p.video)}" controls playsinline preload="metadata"${p.poster ? ` poster="${esc(assetUrl(p.poster))}"` : ''}></video>`;
    else if (p.poster) player = `<img src="${esc(assetUrl(p.poster))}" alt="${esc(p.title)}" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block">`;
    else player = `<div style="aspect-ratio:16/9;position:relative;color:var(--acc)">
        <svg viewBox="0 0 160 90" preserveAspectRatio="none"
          style="position:absolute;inset:0;width:100%;height:100%;opacity:var(--art-op)"
          aria-hidden="true">${art(p.category, 1, 160, 90)}</svg>
        <span class="lab" style="position:absolute;left:16px;bottom:14px">Video not uploaded yet</span>
      </div>`;

    el.innerHTML = `
      <section class="phead">
        <div class="crumb lab"><a href="../../">Home</a> &rsaquo; <a href="../">Works</a>
          &rsaquo; <a href="../${p.category}/">${cat}</a></div>
        <h1 class="ptitle">${p.title}</h1>
      </section>
      <div class="player">${player}</div>
      <div class="pmeta">
        <div class="body"><p>${p.summary}</p></div>
        <div class="specs">
          <dl>
            <dt>Client</dt><dd>${p.client}</dd>
            <dt>Mode</dt><dd style="color:var(--acc)">${cat}</dd>
            <dt>Year</dt><dd>${p.year}</dd>
            <dt>Role</dt><dd>${p.role}</dd>
            <dt>Tools</dt><dd>${p.tools}</dd>
          </dl>
        </div>
      </div>
      <div class="nextrow">
        <span class="lab">Next</span>
        <a href="./?p=${next.slug}">${next.title}</a>
      </div>`;
  } catch (e) {
    el.innerHTML = `<section class="phead"><h1 class="ptitle">Unavailable</h1>
      <p class="pblurb">${e.message}</p></section>`;
  }
})();
</script>
</body>
</html>
